name: Sandbox image

# Builds (never pushes) the sandbox sidecar image when it changes, so a broken Dockerfile or pin shows up in the PR
# rather than at release time. Publishing happens in docker-publish-release.yaml.
on:
  pull_request:
    paths:
      - src/Schuly.Sandbox/**
      - .github/workflows/sandbox-image.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build sandbox image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the sandbox image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Schuly.Sandbox/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
