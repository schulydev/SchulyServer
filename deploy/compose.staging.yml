services:
  init-perms:
    image: busybox:1.37
    command: sh -c "mkdir -p /data/plugins && chown -R 1654:1654 /data/plugins"
    volumes:
      - ./data:/data
    restart: "no"

  postgres:
    image: postgres:18.1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: schuly
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d schuly -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: >
      server -dir=/data
      -s3 -s3.config=/etc/seaweedfs/s3-config.json -s3.port=8333
      -master.volumeSizeLimitMB=1024
    volumes:
      - ./data/seaweedfs:/data
      - ./config/seaweedfs/s3-config.json:/etc/seaweedfs/s3-config.json:ro

  schulware:
    image: ghcr.io/pianonic/schulwareapi:latest
    restart: unless-stopped
    init: true
    ipc: host
    environment:
      PYTHONUNBUFFERED: "1"

  schulymicrosoft:
    image: ghcr.io/schulydev/schulymicrosoft:latest
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      # Shared with the backend's Microsoft plugin; guards the password sign-in routes.
      SCHULY_SERVICE_KEY: ${MICROSOFT_SERVICE_KEY:-}
    healthcheck:
      # 503 until the startup warm-up is done, then 200. The image has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3

  backend:
    image: ghcr.io/schulydev/schuly:${SCHULY_VERSION:-latest}
    restart: unless-stopped
    env_file: [./config/backend.env]
    volumes:
      - ./data/plugins:/app/plugins                        # downloaded plugin DLLs (host folder)
      - ./config/plugins.yml:/app/plugins.yml              # desired plugin set (writable: endpoints rewrite it)
      - ./config/plugins-config:/app/plugins-config:ro     # per-plugin config
    networks:
      - default
      - sandbox                                             # reaches Helply's sandbox sidecar; nothing else is on it
    depends_on:
      postgres:
        condition: service_healthy
      init-perms:
        condition: service_completed_successfully
      schulymicrosoft:
        condition: service_healthy

  # Helply's workspace: per-conversation microVMs (microsandbox, pinned, beta) with no network, behind a small HTTP API that
  # only the backend can reach. Optional: it starts only with COMPOSE_PROFILES=sandbox and needs /dev/kvm on the host.
  # mem_limit caps every VM together (2 VMs x 256 MB plus the sidecar); the kernel kills a VM inside it, never another
  # service on the host. It gets its API key and nothing else - no database, mail or gateway secrets.
  sandbox:
    image: ghcr.io/schulydev/schuly-sandbox:${SCHULY_VERSION:-latest}
    profiles: [sandbox]
    restart: unless-stopped
    devices:
      - /dev/kvm
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    environment:
      Sandbox__ApiKey: ${SANDBOX_API_KEY:-}
      Sandbox__MaxSandboxes: "2"
    volumes:
      - ./data/sandbox:/root/.microsandbox                 # VM disks; removed with each VM, swept every 5 minutes
    networks:
      - sandbox

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: ${API_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      - backend

networks:
  default:
  # Private and internal: the backend and the sandbox sidecar only, with no route to the internet.
  sandbox:
    internal: true
