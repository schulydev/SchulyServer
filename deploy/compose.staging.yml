# Images are pinned by tag and digest, so an upgrade is always a deliberate edit here. See docs/setup/operations.md.

# Docker caps logs by size only. It has no age limit, so how many days this holds depends on how much each service writes.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  init-perms:
    image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    network_mode: none
    logging: *logging
    command: sh -c "mkdir -p /data/plugins /data/dataprotection && chown -R 1654:1654 /data/plugins /data/dataprotection"
    volumes:
      - ./data:/data
    restart: "no"

  postgres:
    image: postgres:18.1@sha256:1090bc3a8ccfb0b55f78a494d76f8d603434f7e4553543d6e807bc7bd6bbd17f
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: schuly
    volumes:
      - ./data/postgres:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d schuly -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.50@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    restart: unless-stopped
    logging: *logging
    command: >
      server -dir=/data
      -s3 -s3.config=/etc/seaweedfs/s3-config.json -s3.port=8333
      -master.volumeSizeLimitMB=1024
    volumes:
      - ./data/seaweedfs:/data
      - ./config/seaweedfs/s3-config.json:/etc/seaweedfs/s3-config.json:ro
    networks:
      - data

  schulware:
    image: ghcr.io/pianonic/schulwareapi:1.11.1@sha256:bc88288ec4aed2449ec621fb747cfdeaff992246943f512bd218013d9f65d78b
    restart: unless-stopped
    logging: *logging
    init: true
    ipc: host
    environment:
      PYTHONUNBUFFERED: "1"
    networks:
      - school

  schulymicrosoft:
    image: ghcr.io/schulydev/schulymicrosoft:0.18.0@sha256:99557501b5902a443b3032ba52e19c8810c336e68eefa99f4ef85d597e36f09f
    restart: unless-stopped
    logging: *logging
    environment:
      PYTHONUNBUFFERED: "1"
      # Shared with the backend's Microsoft plugin; guards the password sign-in routes.
      SCHULY_SERVICE_KEY: ${MICROSOFT_SERVICE_KEY:-}
    networks:
      - school
    healthcheck:
      # 503 until the startup warm-up is done, then 200. The image has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3

  backend:
    image: ghcr.io/schulydev/schuly:${SCHULY_VERSION:-3.20.0}
    restart: unless-stopped
    logging: *logging
    env_file: [./config/backend.env]
    volumes:
      - ./data/dataprotection:/home/app/.aspnet/DataProtection-Keys # keys for account-linking sessions
      - ./data/plugins:/app/plugins                        # downloaded plugin DLLs (host folder)
      - ./config/plugins.yml:/app/plugins.yml              # desired plugin set
      - ./config/plugins-config:/app/plugins-config:ro     # per-plugin config
    networks:
      - edge
      - data
      - school
      - sandbox                                             # reaches Helply's sandbox sidecar; nothing else is on it
    depends_on:
      postgres:
        condition: service_healthy
      init-perms:
        condition: service_completed_successfully
      schulymicrosoft:
        condition: service_healthy

  # Helply's workspace: per-conversation microVMs (microsandbox, pinned, beta) with no network, behind a small HTTP API that
  # only the backend can reach. Optional: it starts only with COMPOSE_PROFILES=sandbox and needs /dev/kvm on the host.
  # mem_limit caps every VM together (2 VMs x 256 MB plus the sidecar); the kernel kills a VM inside it, never another
  # service on the host. It gets its API key and nothing else - no database, mail or gateway secrets.
  sandbox:
    image: ghcr.io/schulydev/schuly-sandbox:${SCHULY_VERSION:-3.20.0}
    profiles: [sandbox]
    restart: unless-stopped
    logging: *logging
    devices:
      - /dev/kvm
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    environment:
      Sandbox__ApiKey: ${SANDBOX_API_KEY:-}
      Sandbox__MaxSandboxes: "2"
    volumes:
      - ./data/sandbox:/root/.microsandbox                 # VM disks; removed with each VM, swept every 5 minutes
    networks:
      - sandbox

  caddy:
    image: caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: ${API_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    networks:
      - edge
    depends_on:
      - backend

networks:
  # Caddy and the backend only. Caddy reaches nothing else.
  edge:
  # The backend and the two services that talk to schools and Microsoft, which need the internet.
  school:
  # The backend and its storage, with no route to the internet.
  data:
    internal: true
  # Private and internal: the backend and the sandbox sidecar only, with no route to the internet.
  sandbox:
    internal: true
